<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julius Ernst</title>
<meta name="description" content="Julius Ernst: musician, director and cinematographer. Copenhagen / Bari.">
<link rel="canonical" href="https://juliusernst.com/">
<meta property="og:title" content="Julius Ernst">
<meta property="og:description" content="Musician, director and cinematographer. Copenhagen / Bari.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://juliusernst.com/">
<meta property="og:image" content="https://juliusernst.com/images/logo.jpg">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Julius Ernst",
  "url": "https://juliusernst.com/",
  "image": "https://juliusernst.com/images/logo.jpg",
  "jobTitle": ["Musician", "Film director", "Cinematographer"],
  "alumniOf": { "@type": "CollegeOrUniversity", "name": "National Film School of Denmark" },
  "homeLocation": [
    { "@type": "City", "name": "Copenhagen" },
    { "@type": "City", "name": "Bari" }
  ],
  "memberOf": [
    { "@type": "MusicGroup", "name": "Ocean View" },
    { "@type": "MusicGroup", "name": "J.E. Useless" },
    { "@type": "MusicGroup", "name": "Josiah Konder" }
  ],
  "sameAs": [
    "https://josiahkonder.bandcamp.com/"
  ]
}
</script>
<style>
@font-face { font-family: "Bai Jamjuree"; src: url("fonts/bai-jamjuree-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Bai Jamjuree"; src: url("fonts/bai-jamjuree-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
:root {
  /* layout idea: a release sheet in the top left corner, left-aligned with a ragged right edge */
  --paper: #f0f0f0;
  --ink: #000000;
  --muted: #9a9a9a;
  --font-body: "Bai Jamjuree", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 12px;
  line-height: 1.3;
  padding: 9vh 3.3vw 80px;
  -webkit-font-smoothing: antialiased;
}
main { display: grid; gap: 30px; justify-items: start; }
a { color: var(--ink); text-decoration: none; }
a:hover, a:focus-visible { text-decoration: none; }
a:focus-visible { outline: 1px dotted var(--ink); outline-offset: 2px; }
h1, h2 { font-size: 12px; font-weight: 600; margin: 0; }
section { display: grid; gap: 10px; justify-items: start; }
ol, ul { list-style: none; margin: 0; padding: 0; }
/* a tab stop, not a box: the value sits after the title, the right edge stays ragged */
.rows li { display: grid; grid-template-columns: 23em auto; column-gap: 1.5em; }
.rows .y { font-variant-numeric: tabular-nums; }
/* tracklist: times sit a fixed gap after the longest title */
.tracks { display: grid; grid-template-columns: max-content max-content; column-gap: 3em; }
.tracks li { display: contents; }
.muted { color: var(--muted); }
.lines { display: grid; gap: 0; }
.label { display: grid; gap: 0; justify-items: start; }
.label h2 { margin-bottom: 0; }
.label .yr { margin-bottom: 1em; }
.text p { margin: 0 0 1em; max-width: 46ch; white-space: pre-line; }
.text p:last-child { margin-bottom: 0; }
.imgs { display: grid; gap: 12px; }
.imgs { margin-bottom: 12px; }
.imgs img { margin-bottom: 0; }
.nav { display: flex; gap: 1.5em; margin-top: 16px; }
.home { position: fixed; bottom: 4vh; right: 3.3vw; display: block; line-height: 0; }
.home img { width: 60px; height: auto; display: block; }
.logo { display: block; width: 300px; max-width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; margin-bottom: 12px; }
@media (max-width: 420px) {
  body { font-size: 14px; padding: 40px 20px 64px; }
  h1, h2 { font-size: 14px; }
  main { gap: 28px; }
  .rows li { grid-template-columns: minmax(0, 1fr) auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="home" href="#" aria-label="Home"><img src="images/home.jpg" alt=""></a>
<main id="app"></main>

<script>
/* ============================================================
   EDIT HERE. Everything on the site comes from this block.
   - "release" is the front page: the newest thing.
     When a new release comes out, move the old one into
     Previous work > Music as an item, and fill "release" with the new one.
   - "Previous work" items: "url" links straight out, "page" gives the item
     its own page (text, credits, digital links, physical, images).
   - Leave a url as "" to show the line in grey until it exists.
   - Films: put the most relevant page (IMDb, festival, Vimeo) in "links".
     linksTitle: "" shows the links without a heading.
   ============================================================ */
const SITE = {
  name: "Julius Ernst",
  logo: "images/logo.jpg",
  previousLogo: "images/previous-work.jpg",

  release: {
    title: "[Single title]",
    date: "30.11.26",
    tracks: [
      { title: "[Single title]", length: "00:00" }
    ],
    credits: [
      "Recorded at [place], [year]",
      "Engineered by [name]",
      "Mixed by [name]",
      "Mastered by [name]",
      "Cover photograph by [name]"
    ],
    links: [
      { label: "YouTube", url: "" },
      { label: "Spotify", url: "" },
      { label: "Apple Music", url: "" },
      { label: "Bandcamp", url: "" }
    ],
    physical: []
  },

  bio: "Musician, director and cinematographer Julius Ernst has been active within the world of music since the early 2010s. At 19, he toured the United States, and later toured Europe, including a run opening for fellow Copenhageners Iceage. Alongside the music, he works as a cinematographer and director. Julius graduated from the National Film School of Denmark, where he made fragmented, associative films built as much from sound and music as from image. He now releases music under his given name.",

  archive: [
    {
      title: "Films",
      items: [
        { title: "All Things Pass and Will Pass Again / Aiuto", year: "2025",
          page: { text: ["DCP, 30 min\nDenmark / Italy / Iceland\nItalian / Kurdish / Danish\nOriginal music by Hari Shankar Kishore", "A sensory, fragmented film about what remains after loss."],
                  linksTitle: "",
                  links: [{ label: "IMDb", url: "https://www.imdb.com/title/tt37495596/" }] } },
        { title: "Territorie", year: "2024",
          page: { text: ["DCP, 32 min\nDenmark\nDanish", "A father and son, and the unspoken things passed down in an upper-class milieu."] } },
        { title: "Untitled", year: "2023",
          page: { text: ["DCP, 15 min\nDenmark\nFarsi / Danish", "A daughter from the Iranian diaspora visits her parents one evening in the suburbs of Copenhagen, in the early days of the Mahsa Amini uprising."],
                  linksTitle: "",
                  links: [{ label: "FAMUFEST", url: "https://famufest.cz/films/film/untitled" }] } },
        { title: "Gregoris Mountain", year: "2021",
          page: { text: ["40 min\nGreece\nEnglish / Arabic", "A portrait of Greg, a young man with roots in Syria, who returns to Greece and finds refuge in his relationship with a mountain."] } }
      ]
    },
    {
      title: "Music",
      items: [
        { title: "Josiah Konder, demos & voice memos", year: "2022",
          page: {
            credits: [
              "Recorded in Athens & Copenhagen",
              "Produced by Julius Ernst",
              "Mastered by Albert A. Hertz"
            ],
            links: [
              { label: "Spotify", url: "https://open.spotify.com/album/28r3EesxIz8rpT2TBJYzqh" },
              { label: "Bandcamp", url: "https://josiahkonder.bandcamp.com/album/demos-voice-memos" }
            ],
            physical: [{ label: "Cassette", url: "https://josiahkonder.bandcamp.com/album/demos-voice-memos" }]
          } },
        { title: "Josiah Konder, Through the Stutter", year: "2019",
          page: {
            credits: [
              "Recorded at Rhythmic Music Conservatory, Studio B",
              "Engineered by Tanja Vesterbye Jessen",
              "Mixed by Jens \"Benz\" Søndergaard at Jens Benz Studio",
              "Mastered by Joel Krozer at Six Bit Deep",
              "Cover photograph by Ed Gumuchian"
            ],
            links: [
              { label: "Spotify", url: "https://open.spotify.com/album/6KHThGw0UB8KLXFbtOFRxn" },
              { label: "Bandcamp", url: "https://josiahkonder.bandcamp.com/album/through-the-stutter-lp" }
            ],
            physical: [{ label: "Vinyl", url: "" }]
          } },
        { title: "Josiah Konder, Songs for the Stunned", year: "2018",
          page: {
            credits: [
              "Recorded at The Royal Danish Academy of Music",
              "Engineered by Sam Bower",
              "Mixed & mastered by Boris Wilsdorf at andereBaustelle Ton Studio",
              "Cover photograph by Christopher Anderson"
            ],
            links: [{ label: "Bandcamp", url: "https://josiahkonder.bandcamp.com/album/songs-for-the-stunned-lp" }],
            physical: [{ label: "Vinyl", url: "" }]
          } },
        { title: "J.E. Useless, Three Stages of Creative Death", year: "2014",
          page: {
            credits: [
              "Recorded on a TASCAM 488",
              "Engineered & mixed by Julius Ernst & Anton Funck",
              "Mastered by Peter Peter"
            ],
            links: [{ label: "Bandcamp", url: "https://jemusic.bandcamp.com/album/three-stages-of-creative-death" }],
            physical: [{ label: "Vinyl (Discogs)", url: "https://www.discogs.com/release/7019306-JE-Useless-Three-Stages-of-Creative-Death" }]
          } },
        { title: "Ocean View, Ocean.Puke.Future.", year: "2013" },
        { title: "Ocean View, No End", year: "2012" }
      ]
    }
  ]
};
/* ===================== end of edit area ===================== */

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const items = SITE.archive.flatMap(s => s.items);

const link = l => l.url
  ? `<li><a href="${esc(l.url)}" rel="noopener">${esc(l.label)}</a></li>`
  : `<li class="muted">${esc(l.label)}</li>`;

function titleCell(it) {
  if (it.page) return `<a href="#${slug(it.title)}">${esc(it.title)}</a>`;
  if (it.url) return `<a href="${esc(it.url)}" rel="noopener">${esc(it.title)}</a>`;
  return `<span>${esc(it.title)}</span>`;
}

function blocks(p) {
  let out = "";
  if (p.text && p.text.length) out += `<section class="text">${p.text.map(t => `<p>${esc(t)}</p>`).join("")}</section>`;
  if (p.credits && p.credits.length) out += `<section class="lines">${p.credits.map(c => `<div>${esc(c)}</div>`).join("")}</section>`;
  if (p.links && p.links.length) {
    const t = p.linksTitle === undefined ? "Digital" : p.linksTitle;
    out += `<section>${t ? `<h2>${esc(t)}</h2>` : ""}<ul>${p.links.map(link).join("")}</ul></section>`;
  }
  if (p.physical && p.physical.length) out += `<section><h2>Physical</h2><ul>${p.physical.map(link).join("")}</ul></section>`;
  return out;
}

function home() {
  const r = SITE.release;
  const tracks = `<ol class="tracks">${r.tracks.map((t, i) =>
    `<li><span>${i + 1}. ${esc(t.title)}</span><span class="y">${esc(t.length)}</span></li>`).join("")}</ol>`;
  return `<section><h1>${esc(SITE.name)} – ${esc(r.title)}</h1><span>${esc(r.date)}</span></section>` +
    `<section>${tracks}</section>` + blocks(r) +
    `<nav class="nav"><a href="#previous-work">Previous work</a></nav>`;
}

function archive() {
  const secs = SITE.archive.map(s =>
    `<section><h2>${esc(s.title)}</h2><ol class="rows">${s.items.map((it, i) =>
      `<li><span>${i + 1}. ${titleCell(it)}</span><span class="y">${esc(it.year || "")}</span></li>`).join("")}</ol></section>`).join("");
  return secs +
    `<section class="text"><p>${esc(SITE.bio)}</p></section>` +
    `<nav class="nav"><a href="#" class="back">/</a></nav>`;
}

/* a work page opens like a label next to a piece of art:
   title, year and the facts (format, place, language or credits) as one tight block */
function detail(it) {
  const p = Object.assign({}, it.page);
  let facts = [];
  if (p.credits && p.credits.length) { facts = p.credits; p.credits = []; }
  else if (p.text && p.text.length && p.text[0].includes("\n")) { facts = p.text[0].split("\n"); p.text = p.text.slice(1); }
  const label = `<section class="label"><h2>${esc(it.title)}</h2>` +
    (it.year ? `<div class="yr">${esc(it.year)}</div>` : "") +
    facts.map(f => `<div>${esc(f)}</div>`).join("") + `</section>`;
  return label + blocks(p) + `<nav class="nav"><a href="#" class="back">/</a></nav>`;
}

const logo = (src) => src ? `<a href="#" aria-label="${esc(SITE.name)}"><img class="logo" src="${esc(src)}" alt=""></a>` : "";

function render() {
  const h = location.hash.replace("#", "");
  const it = h && items.find(x => x.page && slug(x.title) === h);
  if (h === "previous-work") { app.innerHTML = archive(); document.title = `Previous work – ${SITE.name}`; }
  else if (it) { app.innerHTML = detail(it); document.title = `${it.title} – ${SITE.name}`; }
  else { app.innerHTML = home(); document.title = SITE.name; }
  if (!it) app.insertAdjacentHTML("afterbegin", logo(h === "previous-work" ? (SITE.previousLogo || SITE.logo) : SITE.logo));
  window.scrollTo(0, 0);
}
const trail = [];
let current = location.hash;
window.addEventListener("hashchange", () => {
  if (!backing) trail.push(current);
  backing = false;
  current = location.hash;
  render();
});
let backing = false;
document.addEventListener("click", e => {
  const a = e.target.closest("a.back");
  if (!a) return;
  e.preventDefault();
  backing = true;
  const prev = trail.length ? trail.pop() : "";
  if (prev === location.hash) { backing = false; render(); return; }
  location.hash = prev || "#";
  if (!prev && (location.hash === "" || location.hash === "#")) { backing = false; render(); }
});
render();
</script>
</body>
</html>
